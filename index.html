<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta na MKG IMPORTS">
    <title>MKG IMPORTS — Crie sua conta</title>

    <link rel="icon" type="image/svg+xml" href="logotipo.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="logotipo.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page-shell d-flex align-items-center justify-content-center">
        <section class="signup-card container-fluid" aria-labelledby="signup-title">
            <header class="brand-header text-center">
                <a class="brand" href="#" aria-label="MKG IMPORTS - início">
                    <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-label="Símbolo MKG Imports" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="silverLogo" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                                <stop offset="0" stop-color="#f5f7f6"/>
                                <stop offset="0.48" stop-color="#b6bcba"/>
                                <stop offset="1" stop-color="#777d7b"/>
                            </linearGradient>
                        </defs>
                        <path d="M32 3 57 17.5v29L32 61 7 46.5v-29L32 3Z" fill="none" stroke="url(#silverLogo)" stroke-width="2"/>
                        <path d="M32 8.5 52.5 20v24L32 55.5 11.5 44V20L32 8.5Z" fill="#151818" stroke="#69706e" stroke-width="1"/>
                        <path d="M18.5 42V22l7 9.5 6.5-9.5 6.5 9.5 7-9.5v20" fill="none" stroke="url(#silverLogo)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="32" cy="32" r="2.2" fill="#d8dcda"/>
                        <path d="M32 12v6M32 46v6M14.5 32h6M43.5 32h6" stroke="#909694" stroke-width="1.2" stroke-linecap="round"/>
                    </svg>
                    <span class="brand-copy"><span class="brand-name">MKG</span> <span class="brand-category">IMPORTS</span></span>
                </a>
            </header>

            <div class="card-body-custom">
                <div class="heading text-center">
                    <h1 id="signup-title">Crie sua conta</h1>
                    <p>Faça parte da MKG IMPORTS e tenha acesso às nossas novidades</p>
                </div>

                <div id="success-alert" class="alert alert-success success-alert d-none" role="status" aria-live="polite">
                    <strong>Cadastro realizado com sucesso!</strong>
                    <div id="success-details" class="mt-2"></div>
                </div>

                <form id="registration-form" novalidate>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome completo</label>
                        <input type="text" class="form-control" id="nome" name="nome"
                               autocomplete="name" required aria-describedby="nome-error">
                        <div id="nome-error" class="invalid-feedback"></div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" name="email"
                               autocomplete="email" required aria-describedby="email-error">
                        <div id="email-error" class="invalid-feedback"></div>
                    </div>

                    <div class="mb-3">
                        <label for="senha" class="form-label">Senha</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-control" id="senha" name="senha"
                                   minlength="8" autocomplete="new-password" required aria-describedby="senha-error">
                            <button type="button" id="toggle-password" class="password-toggle" aria-label="Mostrar senha" aria-pressed="false">
                                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <div id="senha-error" class="invalid-feedback"></div>
                    </div>

                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoria</label>
                        <select class="form-select" id="categoria" name="categoria" required aria-describedby="categoria-error">
                            <option value="" selected disabled>Selecione uma categoria</option>
                            <option value="Cliente">Cliente</option>
                            <option value="Revendedor">Revendedor</option>
                            <option value="Parceiro">Parceiro</option>
                        </select>
                        <div id="categoria-error" class="invalid-feedback"></div>
                    </div>

                    <div class="terms-block mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="termos" name="termos" required aria-describedby="termos-error">
                            <label class="form-check-label" for="termos">
                                Li e aceito os termos de uso e a política de privacidade
                            </label>
                        </div>
                        <div id="termos-error" class="invalid-feedback terms-error"></div>
                    </div>

                    <button type="submit" class="btn create-button w-100">CRIAR CONTA</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer text-center">
        © 2026 MKG IMPORTS. Todos os direitos reservados.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
